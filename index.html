<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DNIGL Bonnetjes</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bonnetjes">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="logo-badge">B</div>
      <div>
        <h1>Bon indienen</h1>
        <p class="subtitle">DNIGL bonnetjes</p>
      </div>
    </header>

    <div class="card">
      <form id="form">
        <div class="field">
          <label for="wieBenJij">Wie ben jij</label>
          <select id="wieBenJij" required></select>
        </div>

        <div class="field">
          <label for="photo">Foto van de bon</label>
          <div class="photo-input">
            <input type="file" id="photo" accept="image/*" required>
            <span class="photo-hint">Tik om een foto te maken of te kiezen</span>
          </div>
        </div>

        <div class="field">
          <label for="categorie">Categorie</label>
          <select id="categorie" required></select>
        </div>

        <div class="field" id="toelichtingWrap" hidden>
          <label for="toelichting">Toelichting</label>
          <textarea id="toelichting" rows="2" placeholder="Korte omschrijving"></textarea>
        </div>

        <div class="field">
          <label for="klant">Klant</label>
          <select id="klant" required></select>
        </div>

        <button type="submit" id="submitBtn">
          <span class="btn-label">Versturen</span>
        </button>
        <p class="status-msg" id="statusMsg" role="status" aria-live="polite"></p>
      </form>
    </div>

    <p class="footer-note">Bewaar je bonnetje totdat je een bevestiging hebt gekregen.</p>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
