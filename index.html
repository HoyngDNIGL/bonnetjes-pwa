<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DNIGL Bonnetjes</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bonnetjes">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glow"></div>
  <div class="page">
    <header class="topbar">
      <img src="dnigl-logo.png" alt="DNIGL" class="logo-img">
      <div class="logo-divider"></div>
      <div>
        <h1>DNIGL Bonnetjes</h1>
        <p class="subtitle">Indienen &amp; overzicht</p>
      </div>
    </header>

    <div class="tabs" role="tablist">
      <button type="button" class="tab-btn active" id="tabBonBtn" role="tab" aria-selected="true">Bon indienen</button>
      <button type="button" class="tab-btn" id="tabOverzichtBtn" role="tab" aria-selected="false">Overzicht opvragen</button>
    </div>

    <section id="tabBon" class="tab-panel">
    <div class="card">
      <form id="form">
        <div class="field">
          <label for="wieBenJij">Wie ben jij</label>
          <select id="wieBenJij" required></select>
        </div>

        <div class="field" id="wieBenJijAndersWrap" hidden>
          <label for="wieBenJijAnders">Jouw naam</label>
          <input type="text" id="wieBenJijAnders" placeholder="Voor- en achternaam">
        </div>

        <div class="field">
          <label for="photo">Foto van de bon</label>
          <div class="photo-input">
            <input type="file" id="photo" accept="image/*" required>
            <span class="photo-hint" id="photoHint">Tik om een foto te maken of te kiezen</span>
          </div>
          <div class="photo-confirm" id="photoConfirm" hidden>
            <img id="photoThumb" alt="" class="photo-thumb">
            <span class="photo-check">&#10003;</span>
            <span class="photo-filename" id="photoFilename"></span>
            <button type="button" id="photoRemoveBtn" class="photo-remove" aria-label="Foto verwijderen">&times;</button>
          </div>
        </div>

        <div class="field">
          <label for="categorie">Categorie</label>
          <select id="categorie" required></select>
        </div>

        <div class="field" id="toelichtingWrap" hidden>
          <label for="toelichting">Toelichting</label>
          <textarea id="toelichting" rows="2" placeholder="Korte omschrijving"></textarea>
        </div>

        <div class="field">
          <label for="klant">Klant</label>
          <select id="klant" required></select>
        </div>

        <div class="field" id="klantAndersWrap" hidden>
          <label for="klantAnders">Naam nieuwe klant</label>
          <input type="text" id="klantAnders" placeholder="Klantnaam">
        </div>

        <button type="submit" id="submitBtn">
          <span class="btn-label">Versturen</span>
        </button>
        <p class="status-msg" id="statusMsg" role="status" aria-live="polite"></p>
      </form>
    </div>

    <p class="footer-note">Bewaar je bonnetje totdat je een bevestiging hebt gekregen.</p>
    </section>

    <section id="tabOverzicht" class="tab-panel" hidden>
      <div class="card">
        <form id="overzichtForm">
          <div class="field">
            <label for="startdatum">Startdatum</label>
            <input type="text" id="startdatum" inputmode="numeric" placeholder="dd-mm-jjjj" maxlength="10" required>
          </div>

          <div class="field">
            <label for="einddatum">Einddatum</label>
            <input type="text" id="einddatum" inputmode="numeric" placeholder="dd-mm-jjjj" maxlength="10" required>
          </div>

          <div class="field">
            <label for="medewerker">Medewerker</label>
            <select id="medewerker"></select>
          </div>

          <div class="field">
            <label for="email">E-mailadres voor het overzicht</label>
            <input type="email" id="email" placeholder="naam@dnigl.com" required>
          </div>

          <button type="submit" id="overzichtSubmitBtn">
            <span class="btn-label">Overzicht opvragen</span>
          </button>
          <p class="status-msg" id="overzichtStatusMsg" role="status" aria-live="polite"></p>
        </form>
      </div>

      <p class="footer-note">Het PDF-overzicht wordt naar het opgegeven e-mailadres gestuurd.</p>
    </section>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
