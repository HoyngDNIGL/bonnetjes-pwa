name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Flow 0 URL into config.js
        env:
          FLOW_URL: ${{ secrets.FLOW_URL }}
        run: |
          if [ -z "$FLOW_URL" ]; then
            echo "FLOW_URL secret is not set -- refusing to deploy with a placeholder flowUrl." >&2
            exit 1
          fi
          node -e "
            const fs = require('fs');
            const path = 'config.js';
            const placeholder = 'REPLACE_WITH_FLOW_0_HTTP_TRIGGER_URL';
            const url = process.env.FLOW_URL;
            const content = fs.readFileSync(path, 'utf8');
            if (!content.includes(placeholder)) {
              console.error('Placeholder not found in config.js -- refusing to deploy.');
              process.exit(1);
            }
            fs.writeFileSync(path, content.split(placeholder).join(url));
          "

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
